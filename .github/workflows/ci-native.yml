name: ci-native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          python3 scripts/validate_scaffold.py
          make compiler-proof
          make test
      - name: Contract smoke
        run: ./build/c-stakeholder --output-format json --focus-family code_analyzer --seed 123
