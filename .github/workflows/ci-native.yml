name: ci-native

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          python3 scripts/validate_scaffold.py
          make compiler-proof
          make test
      - name: Contract smoke
        run: ./build/c-stakeholder --output-format json --focus-family code_analyzer --seed 123
