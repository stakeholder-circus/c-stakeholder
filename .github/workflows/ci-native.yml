name: ci-native

on:
  workflow_call:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          python3 scripts/validate_scaffold.py
          make compiler-proof
          make test
      - name: Contract smoke
        run: ./build/c-stakeholder --output-format json --focus-family code_analyzer --seed 123
